<div id="github-html-module" aria-live="polite">
  <p>Loading HTML module…</p>
</div>

<script>
  (() => {
    "use strict";

    const target = document.getElementById("github-html-module");
    const moduleUrl =
      "https://raw.githubusercontent.com/sffr-technology/website-clubexpress/main/" +
      "modules/weekly-runs/monday.html";

    function showError(message) {
      target.replaceChildren();

      const heading = document.createElement("h2");
      heading.textContent = "Unable to load the HTML module";

      const details = document.createElement("p");
      details.textContent = message;

      const retry = document.createElement("button");
      retry.type = "button";
      retry.textContent = "Try again";
      retry.addEventListener("click", loadModule);

      target.append(heading, details, retry);
    }

    async function loadModule() {
      target.innerHTML = "<p>Loading HTML module…</p>";

      try {
        const response = await fetch(moduleUrl, {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) {
          if (response.status === 404) {
            throw new Error("The repository, branch, or HTML module was not found.");
          }

          throw new Error(`GitHub returned HTTP ${response.status}.`);
        }

        const html = await response.text();
        target.innerHTML = html;
      } catch (error) {
        showError(error instanceof Error ? error.message : "An unexpected error occurred.");
      }
    }

    loadModule();
  })();
</script>
